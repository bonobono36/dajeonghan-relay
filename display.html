<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다정한 말 한마디 릴레이 - 응원 메시지 모음</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBF3DE; --ink: #33422C; --ink-soft: #7A7A63;
    --teal-deep: #35643F; --coral-deep: #C25E2C; --line: #E9DEC1;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    color: var(--ink); font-family: 'Noto Sans KR', sans-serif;
    background: linear-gradient(180deg, #FFF9EA 0%, #FBF3DE 30%, #F6EAC9 100%);
    overflow-x: hidden;
  }
  .page-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image: url('mascot-bg.jpg');
    background-repeat: no-repeat; background-position: bottom right;
    background-size: 460px auto; opacity: 0.22;
  }
  .wrap { position: relative; z-index: 1; padding: 32px 40px 60px; }
  header { text-align: center; margin-bottom: 20px; }
  .eyebrow { font-size: 16px; color: var(--teal-deep); font-weight: 500; margin-bottom: 6px; }
  h1 { font-family: 'Gaegu', sans-serif; font-weight: 700; font-size: 44px; margin: 0 0 8px; color: var(--teal-deep); }
  .slogan { font-family: 'Gaegu', sans-serif; font-size: 22px; color: var(--coral-deep); margin: 0 0 4px; }
  .count-bar { text-align: center; font-size: 20px; color: var(--ink-soft); margin-bottom: 28px; }
  .count-bar strong { color: var(--teal-deep); font-weight: 700; font-size: 24px; }

  .board {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 28px;
    max-width: 1600px;
    margin: 0 auto;
  }
  .note {
    position: relative;
    padding: 24px 22px;
    border-radius: 6px;
    min-height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 16px rgba(90, 70, 30, 0.15);
    animation: pop-in 0.4s ease;
  }
  @keyframes pop-in {
    from { opacity: 0; transform: scale(0.9) rotate(0deg); }
  }
  .note p {
    font-family: 'Gaegu', sans-serif;
    font-size: 22px;
    line-height: 1.5;
    text-align: center;
    margin: 0;
    color: #3a3226;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .note.c0 { background: #FFF0AE; transform: rotate(-2deg); }
  .note.c1 { background: #D9F0D6; transform: rotate(1.5deg); }
  .note.c2 { background: #FBD9D0; transform: rotate(-1deg); }
  .note.c3 { background: #CFE7F2; transform: rotate(2deg); }
  .note.c4 { background: #FBE1C0; transform: rotate(-1.5deg); }
  .note::before {
    content: ""; position: absolute; top: -10px; left: 50%; transform: translateX(-50%) rotate(-4deg);
    width: 44px; height: 18px; background: rgba(255,255,255,0.55); border-radius: 2px;
  }
  .empty-state { text-align: center; color: var(--ink-soft); font-size: 22px; padding: 80px 0; }
</style>
</head>
<body>
<div class="page-bg"></div>
<div class="wrap">
  <header>
    <div class="eyebrow">세계 자살예방의 날 캠페인</div>
    <h1>다정한 말 한마디 릴레이</h1>
    <p class="slogan">오늘 건넨 다정함, 잊지 않고 돌려드릴게요</p>
  </header>
  <div class="count-bar" id="countBar">메시지를 불러오는 중...</div>
  <div class="board" id="board"></div>
  <div class="empty-state" id="emptyState" style="display:none;">아직 첫 메시지를 기다리고 있어요 🌿</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAacDHT3ifs9WvMURNPrP3o0koHKCD9HMo",
  authDomain: "dajung2026-46e8d.firebaseapp.com",
  projectId: "dajung2026-46e8d",
  storageBucket: "dajung2026-46e8d.firebasestorage.app",
  messagingSenderId: "22617200899",
  appId: "1:22617200899:web:b2c42e52ae6f4b6477f136"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const messagesRef = db.collection('messages');

const board = document.getElementById('board');
const countBar = document.getElementById('countBar');
const emptyState = document.getElementById('emptyState');
const COLOR_CLASSES = ['c0', 'c1', 'c2', 'c3', 'c4'];

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

messagesRef.orderBy('ts', 'desc').onSnapshot((snapshot) => {
  const visible = snapshot.docs.map(d => d.data()).filter(m => !m.hidden);

  if (visible.length === 0) {
    board.innerHTML = '';
    emptyState.style.display = 'block';
    countBar.innerHTML = '아직 첫 메시지를 기다리고 있어요';
    return;
  }
  emptyState.style.display = 'none';
  countBar.innerHTML = '지금까지 <strong>' + visible.length + '명</strong>이 다정함을 이어가고 있어요';

  board.innerHTML = visible.map((m, i) => `
    <div class="note ${COLOR_CLASSES[i % COLOR_CLASSES.length]}">
      <p>${escapeHtml(m.text)}</p>
    </div>
  `).join('');
});
</script>
</body>
</html>
